<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon. Next.js serves app/icon.svg as the tab icon automatically.

    Standalone on purpose: colours are hardcoded to the dark palette rather
    than read from CSS variables, because a favicon renders outside the
    document and has no access to them. It sits on its own dark tile so it
    holds up against both light and dark browser chrome.

    The mark is scaled to 78% so it has real padding inside the tile —
    at 16px a mark that runs to the edges turns into a smudge.
  -->
  <rect width="64" height="64" rx="14" fill="#0A0E13"/>
  <g transform="translate(32 32) scale(0.78) translate(-32 -32)">
    <path d="M16 22 L32 11 L48 22" stroke="#C2F03A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 37 L32 26 L48 37" stroke="#F0F4F8" stroke-opacity="0.65" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 52 L32 41 L48 52" stroke="#F0F4F8" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
